spring:
  application:
    name: routewise-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routewise}
    username: ${DB_USER:routewise}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    # Şemanın tek sahibi Liquibase'tir. Hibernate şemaya dokunmaz;
    # 'validate' bile açılmıyor çünkü entity'ler henüz yazılmadı (Faz 2).
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # api-contract.md §3: size en fazla 100. Spring'in varsayılan sınırı 2000'dir.
  data:
    web:
      pageable:
        max-page-size: 100

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

routewise:
  # İş günü depo saatine göre döner (günlük limitler, sipariş no yılı).
  time-zone: Europe/Istanbul

  # Python servisinin adresi — compose ağında servis adıyla erişilir.
  optimizer:
    base-url: ${OPTIMIZER_URL:http://localhost:8000}

  address:
    # Bu eşiğin ötesindeki nokta reddedilir: araç oraya ulaşamaz.
    max-snap-distance-m: 50
    # Diğer teslimatlardan bu kadar uzak nokta uyarı üretir, engellemez.
    outlier-distance-m: 5000
    # Alıcının günlük adres değiştirme hakkı — rota titreşimini önler.
    max-changes-per-day: 2

  jwt:
    # En az 32 bayt. Ortam değişkeniyle verilir; varsayılan YALNIZCA yerel
    # geliştirme içindir ve gerçek kurulumda mutlaka değiştirilmelidir.
    secret: ${JWT_SECRET:yerel-gelistirme-icin-anahtar-degistir-32+}
    access-ttl: 15m
    refresh-ttl: 14d
    issuer: routewise

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.routewise: INFO
    liquibase: INFO

server:
  port: 8080
