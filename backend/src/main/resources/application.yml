spring:
  application:
    name: routewise-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routewise}
    username: ${DB_USER:routewise}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    # Şemanın tek sahibi Liquibase'tir. Hibernate şemaya dokunmaz;
    # 'validate' bile açılmıyor çünkü entity'ler henüz yazılmadı (Faz 2).
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

routewise:
  # Python servisinin adresi — compose ağında servis adıyla erişilir.
  optimizer:
    base-url: ${OPTIMIZER_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.routewise: INFO
    liquibase: INFO

server:
  port: 8080
