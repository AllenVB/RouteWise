name: routewise

# Faz 0 kapsamı: db + dataprep.
# backend / python / frontend servisleri Faz 1a'da eklenecek — henüz Dockerfile'ları yok.

services:
  db:
    # Etiket biçimi: <postgres>-<postgis>-<pgrouting>
    # PG 17 için yayınlanan PostGIS sürümü 3.5'tir; yama sürümüne kadar
    # sabitlendi — tez için tekrar üretilebilirlik.
    image: pgrouting/pgrouting:17-3.5-4.0.1
    container_name: routewise-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready tek başına yetmez: uzantılar kurulmadan "hazır" görünebilir.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_extension WHERE extname='pgrouting'\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    image: routewise-backend:local
    container_name: routewise-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OPTIMIZER_URL: http://python:8000
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  python:
    build:
      context: ../python
    image: routewise-python:local
    container_name: routewise-python
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    environment:
      ROUTEWISE_GRAPH_PATH: /data/graph/bandirma-graph.npz
    volumes:
      # Graf salt okunur: servis iş verisi açısından durumsuzdur, grafı yazmaz.
      - graphdata:/data/graph:ro
      # Geliştirmede kaynak bağlanır; --reload ile anında yansır.
      - ../python/app:/srv/app
      - ../python/tests:/srv/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    image: routewise-frontend:local
    container_name: routewise-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      BACKEND_ORIGIN: http://backend:8080
    volumes:
      # node_modules container'da kalsın; Windows'tan bağlanırsa bozulur.
      - ../frontend/src:/srv/src
      - ../frontend/index.html:/srv/index.html
      - ../frontend/vite.config.ts:/srv/vite.config.ts
    restart: unless-stopped

  dataprep:
    build:
      context: ./dataprep
    image: routewise-dataprep:local
    container_name: routewise-dataprep
    # Normal `docker compose up` ile başlamaz; yalnızca açıkça çağrılır:
    #   docker compose --profile tools run --rm dataprep <adım>
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      OSM_SOURCE_URL: ${OSM_SOURCE_URL}
    volumes:
      - osmdata:/data/osm
      - graphdata:/data/graph
    restart: "no"

volumes:
  # Üçü de pahalıdır: 619 MB indirme ve dakikalarca süren graf import'u.
  # `docker compose down -v` ÇALIŞTIRILMAMALIDIR.
  pgdata:
    name: routewise-pgdata
  osmdata:
    name: routewise-osmdata
  graphdata:
    name: routewise-graphdata
